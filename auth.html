<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Conectando Discord | HorizonVille</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.ico"></head><body><main class="shell" style="min-height:100vh;display:grid;place-items:center"><section class="card login-card"><img src="assets/logo-horizonville.png" alt="HorizonVille"><h1>Conectando Discord</h1><p id="authStatus">Validando sua conta...</p></section></main><script src="config.js?v=20260817-v7"></script><script src="common.js?v=20260817-v7"></script><script>
(async()=>{const q=new URLSearchParams(location.search),code=q.get('code'),next=q.get('next')||'/';const el=document.querySelector('#authStatus');if(q.get('error')||!code){el.textContent='Não foi possível concluir o login. Tente novamente.';return}try{const d=await HV.request('/api/auth/discord/exchange',{method:'POST',json:{code}});localStorage.setItem('hv_user_token',d.token);location.replace(next)}catch(e){el.textContent=e.message}})();
</script></body></html>
