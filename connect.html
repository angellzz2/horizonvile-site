<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Conectar ao HorizonVille</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell" style="min-height:100vh;display:grid;place-items:center"><section class="card login-card"><img src="assets/logo-horizonville.png" alt="HorizonVille"><h1>Abrindo o MTA...</h1><p id="connectMsg">Se o jogo não abrir automaticamente, use o endereço exibido abaixo.</p><code id="connectCode"></code><a href="index.html" class="btn ghost" style="margin-top:14px">Voltar ao site</a></section></main><script>const q=new URLSearchParams(location.search),server=q.get('server')||'';document.getElementById('connectCode').textContent=server;if(/^mtasa:\/\//i.test(server)){setTimeout(()=>location.href=server,250)}else document.getElementById('connectMsg').textContent='Endereço de servidor inválido.';</script></body></html>
