<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Minhas Compras | HorizonVille</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="/favicon.ico"></head><body><header class="topbar"><div class="shell"><a class="brand" href="index.html"><img src="assets/logo-horizonville.png" alt="HorizonVille"><b>Horizon<span>Ville</span></b></a><nav class="nav"><a href="index.html">Início</a><a href="store.html">Loja</a></nav><div class="actions"><a class="cart-icon-link cart-link" aria-label="Carrinho" title="Carrinho" href="cart.html"><span class="cart-emoji">🛒</span><span class="cart-count">0</span></a><button class="menu">☰</button></div></div></header><aside class="mobile-nav"><button class="close-menu">×</button><a href="index.html">Início</a><a href="store.html">Loja</a><a href="cart.html">Carrinho</a></aside><main class="shell"><section class="page-hero"><span class="eyebrow">CONTA</span><h1>Minhas Compras</h1><p>Pedidos vinculados ao seu Discord autenticado.</p></section><section id="ordersContent" class="section" style="padding-top:15px"></section></main><div class="toast"></div><script src="config.js?v=20260817-v7"></script><script src="common.js?v=20260817-v7"></script><script>
(async()=>{const box=document.getElementById('ordersContent');const me=await HV.me(true);if(!me){box.innerHTML='<div class="card auth-required"><h2>Conecte seu Discord</h2><button class="btn primary" id="connectOrders">Conectar com Discord</button></div>';document.getElementById('connectOrders').onclick=()=>HV.login('/orders.html');return;}try{const d=await HV.request('/api/account/orders',{auth:true});const os=d.orders||[];box.innerHTML=os.length?`<div class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>Pedido</th><th>Itens</th><th>Total</th><th>Pagamento</th><th>Entrega</th><th>Data</th></tr></thead><tbody>${os.map(o=>`<tr><td><b>${HV.escape(o.id)}</b></td><td>${(o.items||[]).map(i=>`${i.qty||1}x ${HV.escape(i.name||i.id)}`).join('<br>')}</td><td>${HV.money(o.total)}</td><td>${HV.escape(o.paymentStatus||'—')}</td><td>${HV.escape(o.deliveryStatus||'—')}</td><td>${new Date(o.createdAt).toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="card auth-required"><h2>Nenhuma compra ainda</h2><a class="btn orange" href="store.html">Abrir loja</a></div>'}catch(e){box.innerHTML=`<div class="card auth-required"><h2>Não foi possível carregar</h2><p>${HV.escape(e.message)}</p></div>`}})();
</script></body></html>
